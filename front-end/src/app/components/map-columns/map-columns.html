<form [formGroup]="form" (ngSubmit)="onSubmit()">
  @for (col of columnHeaders; track col) {
    <div class="form-row" [class.single]="form.controls[col.camel].controls.type.value !== 'date'">
      <rux-select
        [id]="`mapColumns_ruxSelect_${col.camel}`"
        [inputId]="`mapColumns_input_${col.camel}`"
        [labelId]="`mapColumns_label_${col.camel}`"
        [name]="`mapColumns_select_${col.camel}`"
        [label]="col.label"
        [value]="form.controls[col.camel].controls.type.value"
        [invalid]="submitted && form.controls[col.camel]?.invalid"
        [errorText]="submitted && form.controls[col.camel]?.invalid ? 'Please select a type' : ''"
        (ruxchange)="formChange($event, col.camel, 'type')"
      >
        @for (type of columnTypes; track type) {
          <rux-option [value]="type" [label]="type | titlecase"></rux-option>
        }
      </rux-select>

      @if (form.controls[col.camel].controls.type.value === 'date') {
        <rux-input
          label="Format"
          [value]="form.controls[col.camel].controls.format.value"
          (ruxchange)="formChange($event, col.camel, 'format')"
        ></rux-input>
      }
    </div>
  }

  <div class="submit-button">
    <rux-button type="button" secondary (click)="goBack()">Back</rux-button>
    <rux-button type="submit">Submit</rux-button>
  </div>
</form>
