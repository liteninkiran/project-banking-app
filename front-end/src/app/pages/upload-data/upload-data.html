<h1>Upload CSV Data</h1>

<rux-tabs id="dataUploadTabs">
  <rux-tab
    id="selectFilesTab"
    [selected]="activeTab === 'selectFilesTab'"
    [disabled]="activeTab !== 'selectFilesTab'"
    >Select Files</rux-tab
  >
  <rux-tab
    id="mapColumnsTab"
    [selected]="activeTab === 'mapColumnsTab'"
    [disabled]="activeTab !== 'mapColumnsTab'"
    >Map Columns</rux-tab
  >
</rux-tabs>

<rux-tab-panels id="dataUploadPanels" aria-labelledby="dataUploadTabs">
  <rux-tab-panel id="selectFilesPanel" aria-labelledby="selectFilesTab"
    ><app-drag-and-drop (fileData)="getFileData($event)"></app-drag-and-drop
  ></rux-tab-panel>
  <rux-tab-panel id="mapColumnsPanel" aria-labelledby="mapColumnsTab"
    ><app-map-columns
      [columns]="columns"
      (cancel)="cancelMap()"
      (submit)="handleMappedColumns($event)"
    ></app-map-columns
  ></rux-tab-panel>
</rux-tab-panels>
