<h1>Upload CSV Data</h1>

<rux-tabs id="dataUploadTabs">
  <rux-tab id="selectFilesTab" [disabled]="activeTab !== 'selectFilesTab'">Select Files</rux-tab>
  <rux-tab id="mapColumnsTab" [disabled]="activeTab !== 'mapColumnsTab'"
    >Map Column Headers</rux-tab
  >
</rux-tabs>

<rux-tab-panels aria-labelledby="dataUploadPanels">
  <rux-tab-panel aria-labelledby="selectFilesPanel"
    ><app-drag-and-drop (fileData)="getFileData($event)"></app-drag-and-drop
  ></rux-tab-panel>
  <rux-tab-panel aria-labelledby="mapColumnsPanel"></rux-tab-panel>
</rux-tab-panels>
